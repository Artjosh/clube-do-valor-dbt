<template><style>@font-face{font-family:Body;src:url('assets/fonts/arial.ttf')}#root{width:100%;height:100%;font-family:Body}.caption{position:absolute;left:192px;top:866px;width:1180px;height:140px;display:flex;align-items:center;font-size:28px;line-height:1.3;color:#eef4ef}.caption span{background:#173e44;padding:14px 22px;border-radius:6px;width:100%}.progress{position:absolute;left:120px;right:120px;bottom:66px;height:4px;background:#d5dfd8}.progress>div{height:100%;background:#a66f47;transform-origin:left center}</style><div id="root" data-composition-id="captions" data-start="0" data-duration="231" data-width="1920" data-height="1080"><div id="caption-0" class="clip caption" data-start="0.500" data-duration="4.886" data-track-index="1"><span>Esta apresentação explica a solução do teste de engenharia de dados do Clube do Valor.</span></div><div id="caption-1" class="clip caption" data-start="5.386" data-duration="4.560" data-track-index="1"><span>O núcleo é um projeto dbt com DuckDB, executável localmente a partir do README.</span></div><div id="caption-2" class="clip caption" data-start="9.947" data-duration="2.932" data-track-index="1"><span>A extensão web transforma os resultados em análise navegável.</span></div><div id="caption-3" class="clip caption" data-start="12.878" data-duration="4.560" data-track-index="1"><span>O foco é preservar a fonte, explicitar decisões e mostrar os limites dos dados.</span></div><div id="caption-4" class="clip caption" data-start="19.500" data-duration="4.729" data-track-index="1"><span>Os arquivos originais foram preservados: cem transações e vinte e sete cadastros.</span></div><div id="caption-5" class="clip caption" data-start="24.229" data-duration="5.517" data-track-index="1"><span>O staging produz noventa e oito transações válidas e vinte e cinco clientes canônicos.</span></div><div id="caption-6" class="clip caption" data-start="29.746" data-duration="2.365" data-track-index="1"><span>Registros rejeitados continuam auditáveis na fonte.</span></div><div id="caption-7" class="clip caption" data-start="32.111" data-duration="3.547" data-track-index="1"><span>A escolha de cadastro prioriza completude, com desempate determinístico.</span></div><div id="caption-8" class="clip caption" data-start="35.657" data-duration="5.517" data-track-index="1"><span>Transações de conteúdo igual, mas identificadores distintos, não são apagadas sem confirmação de negócio.</span></div><div id="caption-9" class="clip caption" data-start="43.500" data-duration="2.002" data-track-index="1"><span>A estrutura separa três responsabilidades.</span></div><div id="caption-10" class="clip caption" data-start="45.502" data-duration="3.603" data-track-index="1"><span>Staging normaliza textos, converte tipos e filtra registros inválidos.</span></div><div id="caption-11" class="clip caption" data-start="49.104" data-duration="5.204" data-track-index="1"><span>Intermediate junta transações ao cliente canônico e calcula quantidades e valores com sinal.</span></div><div id="caption-12" class="clip caption" data-start="54.308" data-duration="5.604" data-track-index="1"><span>Marts entrega dimensão de clientes, fato de transações e carteira por cliente e ativo.</span></div><div id="caption-13" class="clip caption" data-start="59.913" data-duration="4.003" data-track-index="1"><span>Macros reutilizam regras, e testes e documentação acompanham os modelos.</span></div><div id="caption-14" class="clip caption" data-start="66.500" data-duration="4.379" data-track-index="1"><span>A carteira soma compras menos vendas em quantidade e valor financeiro.</span></div><div id="caption-15" class="clip caption" data-start="70.879" data-duration="3.583" data-track-index="1"><span>Valores usam tipos decimais, evitando cálculos aproximados no núcleo.</span></div><div id="caption-16" class="clip caption" data-start="74.462" data-duration="6.767" data-track-index="1"><span>Esse resultado não representa patrimônio, lucro ou valor de mercado: faltam cotações atuais, taxas e saldo inicial.</span></div><div id="caption-17" class="clip caption" data-start="81.229" data-duration="3.981" data-track-index="1"><span>Clientes sem negociação permanecem na dimensão, sem gerar posições artificiais.</span></div><div id="caption-18" class="clip caption" data-start="85.210" data-duration="2.389" data-track-index="1"><span>As seis posições negativas ficam visíveis.</span></div><div id="caption-19" class="clip caption" data-start="89.500" data-duration="4.958" data-track-index="1"><span>A validação registrada teve setenta e um testes aprovados e seis alertas.</span></div><div id="caption-20" class="clip caption" data-start="94.458" data-duration="4.132" data-track-index="1"><span>Eles expõem posições negativas, transações inválidas, duplicidades e cadastro incompleto.</span></div><div id="caption-21" class="clip caption" data-start="98.590" data-duration="2.479" data-track-index="1"><span>Invariantes dos modelos continuam sendo erros.</span></div><div id="caption-22" class="clip caption" data-start="101.069" data-duration="4.132" data-track-index="1"><span>Os diagnósticos conhecidos usam avisos, com linhas de falha persistidas.</span></div><div id="caption-23" class="clip caption" data-start="105.201" data-duration="3.719" data-track-index="1"><span>No modo estrito, os seis avisos viram falhas esperadas.</span></div><div id="caption-24" class="clip caption" data-start="108.920" data-duration="4.958" data-track-index="1"><span>Código de saída zero no modo normal não significa fonte sem problemas.</span></div><div id="caption-25" class="clip caption" data-start="115.500" data-duration="4.491" data-track-index="1"><span>O fato é incremental pela chave da transação, usando delete mais insert.</span></div><div id="caption-26" class="clip caption" data-start="119.991" data-duration="6.363" data-track-index="1"><span>A janela padrão reprocessa trinta dias em relação à maior data já carregada, não ao relógio atual.</span></div><div id="caption-27" class="clip caption" data-start="126.354" data-duration="5.240" data-track-index="1"><span>Isso permite repetir a entrada sem duplicar identificadores e aplicar correções dentro da janela.</span></div><div id="caption-28" class="clip caption" data-start="131.594" data-duration="2.994" data-track-index="1"><span>Alterações antigas, exclusões e invalidações exigem reconstrução completa.</span></div><div id="caption-29" class="clip caption" data-start="134.588" data-duration="2.246" data-track-index="1"><span>Esses limites estão documentados e testados.</span></div><div id="caption-30" class="clip caption" data-start="138.500" data-duration="6.353" data-track-index="1"><span>Para reproduzir, siga o README da raiz: crie o ambiente Python três ponto doze e instale as dependências fixadas.</span></div><div id="caption-31" class="clip caption" data-start="144.853" data-duration="5.350" data-track-index="1"><span>Com o ambiente ativado, execute dbt seed, dbt run e dbt test, usando profiles dir ponto.</span></div><div id="caption-32" class="clip caption" data-start="150.202" data-duration="5.015" data-track-index="1"><span>O README também traz os caminhos completos para PowerShell, geração de documentação e full refresh.</span></div><div id="caption-33" class="clip caption" data-start="155.217" data-duration="2.675" data-track-index="1"><span>O pipeline não depende da autenticação do site.</span></div><div id="caption-34" class="clip caption" data-start="159.500" data-duration="3.210" data-track-index="1"><span>A extensão Vinext oferece três profundidades, sem planos pagos.</span></div><div id="caption-35" class="clip caption" data-start="162.710" data-duration="1.427" data-track-index="1"><span>Copper resume os movimentos.</span></div><div id="caption-36" class="clip caption" data-start="164.137" data-duration="4.637" data-track-index="1"><span>Silver permite investigar clientes, ativos e transações, com filtros, detalhes e exportação CSV.</span></div><div id="caption-37" class="clip caption" data-start="168.774" data-duration="2.140" data-track-index="1"><span>Gold expõe qualidade, linhagem e evidências.</span></div><div id="caption-38" class="clip caption" data-start="170.914" data-duration="4.280" data-track-index="1"><span>O site lê um snapshot exportado do DuckDB em modo somente leitura.</span></div><div id="caption-39" class="clip caption" data-start="175.194" data-duration="4.637" data-track-index="1"><span>Não é uma consulta de mercado em tempo real, nem altera o pipeline.</span></div><div id="caption-40" class="clip caption" data-start="181.500" data-duration="4.369" data-track-index="1"><span>DuckDB guarda a análise; Supabase e PostgreSQL cuidam da identidade e das permissões.</span></div><div id="caption-41" class="clip caption" data-start="185.869" data-duration="3.697" data-track-index="1"><span>O login por código de e-mail cria uma conta sem acesso.</span></div><div id="caption-42" class="clip caption" data-start="189.566" data-duration="4.705" data-track-index="1"><span>A contrassenha é um convite, e só concede permissão depois da verificação do e-mail.</span></div><div id="caption-43" class="clip caption" data-start="194.271" data-duration="4.033" data-track-index="1"><span>Página, APIs e CSV exigem sessão e role de analista no servidor.</span></div><div id="caption-44" class="clip caption" data-start="198.304" data-duration="3.697" data-track-index="1"><span>A confirmação pelo celular preserva comparação de código e aprovação explícita.</span></div><div id="caption-45" class="clip caption" data-start="204.500" data-duration="7.603" data-track-index="1"><span>A integração local registrou duzentas e cinco verificações HTTP e cinquenta e quatro no navegador Edge com sessões reais.</span></div><div id="caption-46" class="clip caption" data-start="212.103" data-duration="6.403" data-track-index="1"><span>Esses testes comprovam as jornadas avaliadas, mas não substituem a validação operacional do envio de e-mail.</span></div><div id="caption-47" class="clip caption" data-start="218.506" data-duration="3.201" data-track-index="1"><span>O repositório reúne comandos, decisões, evidências e limitações.</span></div><div id="caption-48" class="clip caption" data-start="221.707" data-duration="3.201" data-track-index="1"><span>Consulte a documentação para o estado da publicação.</span></div><div id="caption-49" class="clip caption" data-start="224.908" data-duration="4.802" data-track-index="1"><span>Assim, o avaliador pode reproduzir o pipeline e conferir a extensão separadamente.</span></div><div class="progress"><div id="film-progress"></div></div></div><script>const tl=gsap.timeline({paused:true});tl.fromTo('#film-progress',{scaleX:0},{scaleX:1,duration:231,ease:'none'},0);window.__timelines.captions=tl;</script></template>
