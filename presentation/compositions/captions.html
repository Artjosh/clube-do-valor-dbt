<template><style>#root{width:100%;height:100%;font-family:Film,sans-serif}.caption{position:absolute;left:192px;top:842px;width:1536px;height:134px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:32px;line-height:1.35;color:#fff}.caption span{padding:14px 24px;background:#142c3a;border-radius:4px;max-width:1536px}</style><div id="root" data-composition-id="captions" data-start="0" data-duration="124" data-width="1920" data-height="1080" data-no-timeline><div id="caption-0" class="clip caption" data-start="0.500" data-duration="3.601" data-track-index="1"><span>Como transformar arquivos com defeitos em uma carteira confiável?</span></div><div id="caption-1" class="clip caption" data-start="4.101" data-duration="4.001" data-track-index="1"><span>Esta apresentação gerada explica a solução com dbt e DuckDB.</span></div><div id="caption-2" class="clip caption" data-start="8.102" data-duration="2.801" data-track-index="1"><span>Os arquivos originais são preservados nos seeds.</span></div><div id="caption-3" class="clip caption" data-start="10.903" data-duration="6.002" data-track-index="1"><span>O tratamento acontece nos modelos, enquanto testes mantêm os problemas da fonte visíveis para auditoria.</span></div><div id="caption-4" class="clip caption" data-start="19.500" data-duration="2.112" data-track-index="1"><span>A arquitetura tem três camadas.</span></div><div id="caption-5" class="clip caption" data-start="21.612" data-duration="3.801" data-track-index="1"><span>Staging padroniza textos, converte tipos e filtra transações inválidas.</span></div><div id="caption-6" class="clip caption" data-start="25.412" data-duration="3.801" data-track-index="1"><span>Clientes repetidos são resolvidos por completude e desempate determinístico.</span></div><div id="caption-7" class="clip caption" data-start="29.213" data-duration="3.378" data-track-index="1"><span>Intermediate relaciona transações e clientes, sem multiplicar eventos.</span></div><div id="caption-8" class="clip caption" data-start="32.591" data-duration="5.490" data-track-index="1"><span>Marts publica a fato, a dimensão e a carteira por cliente e ativo.</span></div><div id="caption-9" class="clip caption" data-start="40.500" data-duration="4.146" data-track-index="1"><span>Na carteira, compras somam e vendas subtraem quantidade e valor financeiro.</span></div><div id="caption-10" class="clip caption" data-start="44.646" data-duration="8.292" data-track-index="1"><span>Por exemplo, as duas primeiras operações de C1 em PETR4, compra de cem e venda de quarenta, deixam sessenta unidades nesse recorte.</span></div><div id="caption-11" class="clip caption" data-start="52.937" data-duration="2.638" data-track-index="1"><span>O saldo financeiro usa preços das operações.</span></div><div id="caption-12" class="clip caption" data-start="55.576" data-duration="3.015" data-track-index="1"><span>Não representa valor de mercado nem lucro realizado.</span></div><div id="caption-13" class="clip caption" data-start="60.500" data-duration="3.535" data-track-index="1"><span>Testes genéricos protegem chaves, campos obrigatórios e domínios.</span></div><div id="caption-14" class="clip caption" data-start="64.035" data-duration="3.093" data-track-index="1"><span>Auditorias expõem registros inválidos e possíveis duplicidades.</span></div><div id="caption-15" class="clip caption" data-start="67.128" data-duration="3.535" data-track-index="1"><span>O teste singular retorna carteiras com posição negativa.</span></div><div id="caption-16" class="clip caption" data-start="70.662" data-duration="3.535" data-track-index="1"><span>Esses defeitos conhecidos geram avisos no fluxo padrão.</span></div><div id="caption-17" class="clip caption" data-start="74.197" data-duration="2.651" data-track-index="1"><span>No modo estrito, avisos viram falhas.</span></div><div id="caption-18" class="clip caption" data-start="76.848" data-duration="3.535" data-track-index="1"><span>Portanto, execução concluída não significa dados sem problemas.</span></div><div id="caption-19" class="clip caption" data-start="82.500" data-duration="6.393" data-track-index="1"><span>A fato é incremental: a data da transação controla uma janela retrospectiva de trinta dias.</span></div><div id="caption-20" class="clip caption" data-start="88.893" data-duration="4.262" data-track-index="1"><span>A chave de transação permite substituir registros sem duplicar identificadores.</span></div><div id="caption-21" class="clip caption" data-start="93.155" data-duration="2.983" data-track-index="1"><span>Correções antigas e exclusões exigem reconstrução completa.</span></div><div id="caption-22" class="clip caption" data-start="96.138" data-duration="5.967" data-track-index="1"><span>Macros reutilizam limpeza, tipagem e validação, mantendo a mesma regra entre transformação e auditoria.</span></div><div id="caption-23" class="clip caption" data-start="104.500" data-duration="6.610" data-track-index="1"><span>Para reproduzir, siga o README na raiz: crie o ambiente Python, instale os requisitos e configure o perfil local.</span></div><div id="caption-24" class="clip caption" data-start="111.110" data-duration="2.783" data-track-index="1"><span>Execute dbt seed, dbt run e dbt test.</span></div><div id="caption-25" class="clip caption" data-start="113.893" data-duration="2.783" data-track-index="1"><span>Revise os avisos e as tabelas de falhas.</span></div><div id="caption-26" class="clip caption" data-start="116.676" data-duration="3.131" data-track-index="1"><span>Use o modo estrito para exigir bloqueio por qualidade.</span></div><div id="caption-27" class="clip caption" data-start="119.807" data-duration="2.783" data-track-index="1"><span>A entrega mantém decisões, código e evidências verificáveis.</span></div></div></template>
