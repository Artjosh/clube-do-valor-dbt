name: clube_do_valor
version: '1.0.0'
config-version: 2
profile: clube_do_valor
model-paths: [models]
seed-paths: [seeds]
macro-paths: [macros]
test-paths: [tests]
clean-targets: [target, dbt_packages]
vars:
  incremental_lookback_days: 30
models:
  clube_do_valor:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table
seeds:
  clube_do_valor:
    +quote_columns: false
    transactions:
      +column_types:
        transaction_id: varchar
        client_id: varchar
        asset_ticker: varchar
        operation: varchar
        quantity: varchar
        unit_price: varchar
        transaction_date: varchar
    clients:
      +column_types:
        client_id: varchar
        name: varchar
        city: varchar
        state: varchar
        created_at: varchar
data_tests:
  +severity: error
  +store_failures: true
