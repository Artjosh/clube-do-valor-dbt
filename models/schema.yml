- name: mart_client_portfolio
  description: Posicao liquida historica por cliente/ativo; nao inclui saldo inicial
    ou cotacao atual.
  columns:
  - name: client_id
    description: Identificador natural do cliente.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_clients')
          field: client_id
  - name: asset_ticker
    description: Codigo do ativo em maiusculas.
    data_tests:
    - not_null
  - name: net_quantity
    description: Soma BUY menos SELL em quantidade, somente no historico fornecido.
    data_tests:
    - not_null
