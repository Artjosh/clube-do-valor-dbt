- name: dim_clients
  description: Dimensao atual de clientes, incluindo clientes sem transacoes; sem
    historico SCD.
  columns:
  - name: client_id
    description: Identificador natural do cliente.
    data_tests:
    - not_null
    - unique
  - name: client_name
    description: Nome cadastral normalizado, sem espacos nas extremidades.
    data_tests:
    - not_null
  - name: city
    description: Cidade cadastral.
    data_tests:
