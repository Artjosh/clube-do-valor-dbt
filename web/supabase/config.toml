# Declarative auth settings. Review before applying to the dedicated project only.
project_id = "clube-do-valor-intelligence"

[auth]
enabled = true
site_url = "https://clube-do-valor-intelligence.artjosh.chatgpt.site"
additional_redirect_urls = ["https://clube-do-valor-intelligence.artjosh.chatgpt.site/api/auth/confirm**", "http://localhost:3000/api/auth/confirm**", "http://127.0.0.1:3000/api/auth/confirm**"]
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
otp_expiry = 300
otp_length = 6

[auth.email.template.magic_link]
subject = "Confirme o acesso no computador — Clube do Valor"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.confirmation]
subject = "Confirme seu e-mail — Clube do Valor"
content_path = "./supabase/templates/confirmation.html"
